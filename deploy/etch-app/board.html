<script>
  // Instant start: before any module loads, show the board's prerendered still and start fetching its files
  // (from Cache Storage when Explore already prefetched them). board.js picks these promises up.
  (function () {
    var q = new URLSearchParams(location.search), id = q.get("id") || "";
    if (!/^gh:/.test(id)) return;
    var w = (q.get("world") || "world").replace(/[^a-z0-9_-]/gi, "") || "world";
    var slug = id.replace(/^gh:/, "").toLowerCase().replace(/\//g, "__").replace(/[^a-z0-9_.-]/g, "-");
    var b = w + "/boards/" + slug + "/", C = "etch-boards-v1";
    function get(u) {
      var hit = window.caches ? caches.open(C).then(function (c) { return c.match(u); }).catch(function () { return null; }) : Promise.resolve(null);
      return hit.then(function (r) {
        if (r) return r;
        return fetch(u).then(function (r2) { if (r2.ok && window.caches) { var c2 = r2.clone(); caches.open(C).then(function (c) { c.put(u, c2); }).catch(function () {}); } return r2; });
      });
    }
    function ok(r) { if (!r.ok) throw new Error(r.status === 404 ? "missing" : "error " + r.status); return r; }
    window.__boot = {
      slug: slug, thumb: b + "thumb.webp",
      glb: get(b + "board.glb").then(ok).then(function (r) { return r.arrayBuffer(); }),
      meta: get(b + "meta.json").then(ok).then(function (r) { return r.json(); }),
      parts: get(b + "parts.json").then(ok).then(function (r) { return r.json(); }),
    };
    for (var k of ["glb", "meta", "parts"]) window.__boot[k].catch(function () {});
    window.__poster = b + "thumb.webp";
  })();
  // The poster: KiCad's raytraced still with its lavender backdrop keyed out (the backdrop is a vertical gradient, so
  // each row's colour comes from that row's edge pixels), drawn on the canvas background so the fade into 3D is seamless.
  window.__showPoster = function (src) {
    var cv = document.getElementById("posterC"); if (!cv || !src) return;
    var im = new Image(); im.decoding = "async";
    im.onload = function () {
      var w = im.naturalWidth, h = im.naturalHeight; cv.width = w; cv.height = h;
      var g = cv.getContext("2d", { willReadFrequently: true }); g.drawImage(im, 0, 0);
      try {
        var d = g.getImageData(0, 0, w, h), p = d.data;
        var br = p[0], bg = p[1], bb = p[2];
        for (var y = 0; y < h; y++) {
          // the edge pixel (left or right) that continues the gradient from the row above; the board may touch one edge
          var a = (y * w) * 4, z = (y * w + w - 1) * 4;
          var da = Math.abs(p[a] - br) + Math.abs(p[a + 1] - bg) + Math.abs(p[a + 2] - bb), dz = Math.abs(p[z] - br) + Math.abs(p[z + 1] - bg) + Math.abs(p[z + 2] - bb);
          var e = da <= dz ? a : z;
          if (Math.min(da, dz) < 24) { br = p[e]; bg = p[e + 1]; bb = p[e + 2]; }
          for (var x = 0; x < w; x++) {
            var i = (y * w + x) * 4, dr = p[i] - br, dg = p[i + 1] - bg, db = p[i + 2] - bb;
            var dist = Math.sqrt(dr * dr + dg * dg + db * db), t = (dist - 10) / 26;
            if (t >= 1) continue;
            if (t <= 0) { p[i + 3] = 0; continue; }
            // half-keyed (KiCad's soft shadow): keep it as a neutral shadow, not a lavender fringe
            var k = t * t * (3 - 2 * t), l = (p[i] + p[i + 1] + p[i + 2]) / 3;
            p[i] = p[i + 1] = p[i + 2] = l * 0.6; p[i + 3] = Math.round(k * 160);
          }
        }
        g.putImageData(d, 0, 0);
      } catch (e) { /* tainted: show as is */ }
      cv.classList.add("in");
    };
    im.src = src;
  };
  document.addEventListener("DOMContentLoaded", function () { if (window.__poster) window.__showPoster(window.__poster); });
</script>

  </div>

    <button class="ib hide-md" id="redoB" title="Redo" aria-label="Redo" disabled></button>
    <button class="ib hide-md" id="histB" title="History" aria-label="History"></button>
    <button class="ib hide-sm" id="resetB" title="Reset view" aria-label="Reset view"></button>
    <span class="relpos"><button class="ib" id="findB" title="Find a part" aria-label="Find a part"></button>
      <div class="pop search-pop" id="findPop"><input id="findQ" placeholder="Find a part: U6, USB, 10k…" autocomplete="off"><div class="plist" id="findL"></div></div></span>
    <span class="vsep"></span>
    <span class="relpos hide-sm"><button class="btn outline" id="dlB">Download</button><div class="pop" id="dlPop"></div></span>
    <button class="btn dark" id="shareB">Share</button>
    <button class="ib" id="panelT" title="Board info" aria-label="Board info"></button>
    <span class="ws"><i>E</i>Public library</span>
  </div>
</header>
<main class="ed-main">

    <div class="demo-badge" id="demo"><i>Demo</i><span></span></div>
    <div class="thread" id="thread" aria-live="polite"></div>
    <div class="composer voice" id="voice">
      <div class="v-row">
        <button type="button" class="micbig" id="micB" aria-label="Talk to Etch" title="Click to talk, or hold Space"></button>
        <div class="v-main">
          <div class="v-state" id="vState">Talk to Etch</div>
          <div class="v-text" id="vText">Point at a part while you talk to pin your question to it.</div>
        </div>
        <div class="lvl" id="lvl" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <form class="typebox" id="comp">
        <input id="ci" autocomplete="off" placeholder="Or type: click the board to pin a comment, or ask about the whole board" aria-label="Type a question for Etch">
        <button type="submit" class="send" id="sendB" aria-label="Send" disabled></button>
      </form>
      <div class="comp-row">
        <button type="button" class="chip on" id="cmtChip" aria-pressed="true" title="Clicking a part pins a comment to it"><span class="dot"></span>Comment</button>
        <button type="button" class="chip opt" id="effChip" title="How hard Etch thinks">Effort Max</button>
        <button type="button" class="chip opt" id="prodChip" aria-pressed="false" title="Answer in plain product terms">Product</button>
      </div>
    </div>

    <div class="ov" id="ov"><svg id="links"></svg></div>
    <div class="hover-tag" id="htag"></div>
    <div class="stage-err" id="err"><div></div></div>

      <div class="cap"><div><b>3D board</b> · drag to orbit · two-finger scroll to pan · pinch to zoom</div><div class="sub" id="info">PCB and soldered parts.</div></div>
      <div class="top-r"><button class="btn outline sm" id="homeV" title="Back to the starting view (or double-click the board)">Reset view</button><div class="seg sm light" id="modeSeg"><button data-m="floor" class="on" aria-pressed="true">Floor</button><button data-m="3d" class="on">3D</button><button data-m="photo">Photo</button></div></div>
    </div>
    <div class="bottombar" id="bb">
      <div class="bb-g" id="maskG"><span>Solder mask</span></div>
      <div class="bb-g" id="silkG"><span>Silkscreen</span></div>
