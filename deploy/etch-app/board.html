<script>
  // Instant start: before any module loads, show the board's prerendered still and start fetching its files
  // (from Cache Storage when Explore already prefetched them). js/editor/main.js picks these promises up.
  (function () {
    var q = new URLSearchParams(location.search), id = q.get("id") || "";
    if (!/^gh:/.test(id)) return;
    var w = (q.get("world") || "world").replace(/[^a-z0-9_-]/gi, "") || "world";
    var slug = id.replace(/^gh:/, "").toLowerCase().replace(/\//g, "__").replace(/[^a-z0-9_.-]/g, "-");
    var b = w + "/boards/" + slug + "/", C = "etch-boards-v1";
    function get(u) {
      var hit = window.caches ? caches.open(C).then(function (c) { return c.match(u); }).catch(function () { return null; }) : Promise.resolve(null);
      return hit.then(function (r) {
        if (r) return r;
        return fetch(u).then(function (r2) { if (r2.ok && window.caches) { var c2 = r2.clone(); caches.open(C).then(function (c) { c.put(u, c2); }).catch(function () {}); } return r2; });
      });
    }
    function ok(r) { if (!r.ok) throw new Error(r.status === 404 ? "missing" : "error " + r.status); return r; }
    window.__boot = {
      slug: slug, thumb: b + "thumb.webp", t0: performance.now(),
      glb: get(b + "board.glb").then(ok).then(function (r) { return r.arrayBuffer(); }),
      meta: get(b + "meta.json").then(ok).then(function (r) { return r.json(); }),
      parts: get(b + "parts.json").then(ok).then(function (r) { return r.json(); }),
    };
    for (var k of ["glb", "meta", "parts"]) window.__boot[k].catch(function () {});
    var l = document.createElement("link"); l.rel = "preload"; l.as = "image"; l.href = b + "thumb.webp"; document.head.appendChild(l);
  })();
</script>
</head>
<body class="ed">
<header class="top">
  <div class="top-row">
    <nav class="crumb" aria-label="Breadcrumb">
      <a class="brand" id="homeL" href="explore"><span id="logo"></span><span class="hide-sm">etch</span></a>
      <span class="sep hide-sm">/</span><a id="exL" class="hide-sm" href="explore">explore</a>
      <span class="sep">/</span><h1 class="title" id="crTitle">Board</h1>
    </nav>
    <div class="top-r">
      <span class="relpos"><button class="btn" id="importB" aria-haspopup="menu">Import</button><div class="pop menu" id="importPop" role="menu"></div></span>
      <span class="relpos"><button class="btn" id="exportB" aria-haspopup="menu">Export</button><div class="pop menu" id="exportPop" role="menu"></div></span>
      <button class="btn dark" id="shareB">Share</button>
    </div>
  </div>
  <div class="tools" role="toolbar" aria-label="Editor tools">
    <div class="tg edit">
      <button class="ib hide-sm" id="copyB" title="Copy (Ctrl+C)" aria-label="Copy"></button>
      <button class="ib hide-sm" id="pasteB" title="Paste (Ctrl+V)" aria-label="Paste"></button>
      <button class="ib hide-sm" id="dupB" title="Duplicate (Ctrl+D)" aria-label="Duplicate"></button>
      <button class="ib" id="delB" title="Delete (Del)" aria-label="Delete"></button>
      <span class="vsep"></span>
      <button class="ib" id="undoB" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
      <button class="ib" id="redoB" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"></button>
    </div>
    <div class="tg view seg" id="viewSeg" role="group" aria-label="View">
      <button data-v="3d" class="on" aria-pressed="true">3D</button>
      <button data-v="top" aria-pressed="false">Top</button>
      <button data-v="ortho" aria-pressed="false">Ortho</button>
    </div>
    <div class="tg right">
      <button class="ib" id="showAllB" title="Show all parts" aria-label="Show all parts"></button>
      <button class="ib" id="panelT" title="Parts panel" aria-label="Toggle parts panel" aria-pressed="true"></button>
    </div>
  </div>
</header>
<main class="ed-main">
  <section class="stage" id="stage" aria-label="3D board">
    <div class="cw" id="cw"></div>
    <div class="poster" id="poster" aria-hidden="true"><canvas id="posterC" width="640" height="400"></canvas></div>
    <svg class="sel-ov" id="selOv" aria-hidden="true"></svg>
    <div class="hover-tag" id="htag" aria-hidden="true"></div>
    <div class="ghost" id="ghost" aria-hidden="true"><div class="g-img"></div><div class="g-tag"></div></div>
    <div class="stage-err" id="err" role="alert"><div></div></div>
    <div class="navc" id="navc">
      <div class="cube-host" id="cubeHost"></div>
      <div class="cam-host" id="camHost"></div>
    </div>
    <div class="insp" id="insp" hidden></div>
    <div class="br" id="br">
      <span class="relpos"><button class="pill-btn" id="setB" aria-haspopup="dialog">Settings</button><div class="pop settings" id="setPop" role="dialog" aria-label="Board settings"></div></span>
      <label class="snap">Snap grid <select id="snapS" aria-label="Snap grid"><option>0.1</option><option>0.25</option><option>0.5</option><option selected>1.0</option><option>2.0</option><option>5.0</option></select> mm</label>
    </div>
    <div class="credits" id="credits"></div>
  </section>
  <aside class="rp" id="rp" aria-label="Parts">
    <button class="rp-chev" id="rpChev" aria-label="Collapse panel" title="Collapse panel"></button>
    <div class="sheet-grab" id="grab"></div>
    <div class="rp-tabs" role="tablist" aria-label="Panel">
      <button role="tab" id="tabParts" data-value="parts" aria-selected="true" aria-controls="paneParts">Parts</button>
      <button role="tab" id="tabBoard" data-value="board" aria-selected="false" aria-controls="paneBoard">This board</button>
    </div>
    <div class="rp-pane" id="paneParts" role="tabpanel" aria-labelledby="tabParts"></div>
    <div class="rp-pane" id="paneBoard" role="tabpanel" aria-labelledby="tabBoard" hidden></div>
  </aside>
</main>
<input type="file" id="glbFile" accept=".glb,model/gltf-binary" hidden>
<script type="module" src="js/editor/main.js"></script>
</body>
</html>
